name: Self-hosted deploy

# Deliberately push-only: never run deployment code for pull requests or manual dispatches.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: self-hosted-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shards-foundation/shards-discord-bot'
    # Register the runner on the trusted host with these labels.
    runs-on: [self-hosted, linux, x64, shards-deploy]
    timeout-minutes: 30
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Validate host prerequisites and local configuration
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version
          command -v rsync >/dev/null
          DEPLOY_DIR="$HOME/shards-discord-bot"
          if [[ "$DEPLOY_DIR" == "/" || "$DEPLOY_DIR" != "$HOME/shards-discord-bot" ]]; then
            echo "Unsafe deployment path" >&2
            exit 1
          fi
          if [[ ! -f "$DEPLOY_DIR/.env" ]]; then
            echo "Missing $DEPLOY_DIR/.env. Provision it on the host; never commit or print secrets." >&2
            exit 1
          fi
          chmod 600 "$DEPLOY_DIR/.env"
          echo "Deployment directory and required tools are present."

      - name: Stage repository while preserving host secrets and local data
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/shards-discord-bot"
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='/.data/' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/shards-discord-bot"
          docker compose --project-directory "$DEPLOY_DIR" \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$DEPLOY_DIR/compose.yaml" config --quiet

      - name: Deploy locally with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/shards-discord-bot"
          docker compose --project-directory "$DEPLOY_DIR" \
            --env-file "$DEPLOY_DIR/.env" \
            -f "$DEPLOY_DIR/compose.yaml" up -d --build --remove-orphans

      - name: Report deployed revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployed commit: $GITHUB_SHA"
          docker compose --project-directory "$HOME/shards-discord-bot" \
            --env-file "$HOME/shards-discord-bot/.env" \
            -f "$HOME/shards-discord-bot/compose.yaml" ps

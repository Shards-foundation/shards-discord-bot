name: Shards Discord Activity Entry Point (add only)

# Deliberately manual and default-branch-only. Never expose the bot token to PRs.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Check the global command registry (default) or add missing Entry Point"
        type: choice
        required: true
        default: check
        options:
          - check
          - add
      confirmation:
        description: "For add only, type PRESERVE-COMMANDS-ADD-ENTRYPOINT"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shards-discord-entry-point-add-only
  cancel-in-progress: false

jobs:
  safe-entry-point:
    if: github.repository == 'Shards-foundation/shards-discord-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify add-only command invariants offline
        run: |
          node --check .github/scripts/activity-entry-point.js
          node --check .github/scripts/ensure-activity-entry-point.js
          node --test test/activity-entry-point.test.js
      - name: Enforce explicit add confirmation
        if: inputs.operation == 'add'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "PRESERVE-COMMANDS-ADD-ENTRYPOINT" ]]; then
            echo "Confirmation did not match. No Discord writes attempted." >&2
            exit 1
          fi
      - name: Check or create just the missing Activity Entry Point
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_BOT_TOKEN" ]]; then
            echo "DISCORD_BOT_TOKEN repository secret is absent; no Discord calls attempted." >&2
            exit 1
          fi
          if [[ "$OPERATION" == "check" ]]; then
            node .github/scripts/ensure-activity-entry-point.js --check
          elif [[ "$OPERATION" == "add" ]]; then
            node .github/scripts/ensure-activity-entry-point.js --apply --confirm-add-only
          else
            echo "Unknown operation, refusing." >&2
            exit 1
          fi
      - name: Final read-only verification
        if: inputs.operation == 'add'
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node .github/scripts/ensure-activity-entry-point.js --check

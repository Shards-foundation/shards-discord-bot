name: Discord Engineering Events
on:
  pull_request:
    types: [opened, reopened, closed]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify Discord when configured
        env:
          SHARDS_DISCORD_WEBHOOK: ${{ secrets.SHARDS_DISCORD_ENGINEERING_WEBHOOK }}
        shell: bash
        run: |
          if [[ ! -f scripts/notify-discord.mjs ]]; then
            echo "Notifier not yet installed on default branch; skipping."
            exit 0
          fi
          node scripts/notify-discord.mjs

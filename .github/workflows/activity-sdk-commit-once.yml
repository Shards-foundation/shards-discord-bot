name: Temporary SDK Artifact Commit
on:
  push:
    branches: ['feat/mission-control-activity-20261115']
    paths: ['.github/workflows/activity-sdk-commit-once.yml']
permissions:
  contents: write
jobs:
  vendor-sdk-once:
    if: github.repository == 'Shards-foundation/shards-discord-bot' && github.ref == 'refs/heads/feat/mission-control-activity-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout fixed target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/mission-control-activity-20261115
          persist-credentials: true
      - name: Build reviewed v2.5.0 SDK bundle
        shell: bash
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @discord/embedded-app-sdk@2.5.0 esbuild@0.25.6
          mkdir -p activity/vendor
          printf "export { DiscordSDK } from '@discord/embedded-app-sdk';\n" > activity/vendor-entry.mjs
          ./node_modules/.bin/esbuild activity/vendor-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --minify --outfile=activity/vendor/discord-sdk.mjs
          node --check activity/vendor/discord-sdk.mjs
          echo "675969a26b20973556721970db3e0201c902e53476c4176c71d80f42e989579d  activity/vendor/discord-sdk.mjs" | sha256sum --check
          git add activity/vendor/discord-sdk.mjs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "vendor(activity): include SHA-verified Discord SDK v2.5.0 bundle"
          git push origin HEAD:refs/heads/feat/mission-control-activity-20261115

name: Telegram Engineering Events

on:
  pull_request:
    types: [opened, reopened, closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.repository.full_name == 'Shards-foundation/shards-discord-bot' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify Telegram when secrets have been configured
        env:
          SHARDS_TELEGRAM_BOT_TOKEN: ${{ secrets.SHARDS_TELEGRAM_BOT_TOKEN }}
          SHARDS_TELEGRAM_CHAT_ID: ${{ secrets.SHARDS_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [[ ! -f scripts/notify-telegram.mjs ]]; then
            echo "Telegram notifier is not on the default branch yet; skipping."
            exit 0
          fi
          node scripts/notify-telegram.mjs

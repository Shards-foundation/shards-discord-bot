name: Shards Activity Verification
on:
  pull_request:
    paths:
      - 'activity/**'
      - '.github/workflows/activity-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activity-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source and run offline tests
        shell: bash
        run: |
          node --check activity/worker.mjs
          node --check activity/ui.mjs
          node --check activity/client.mjs
          node --test activity/test/activity.test.mjs
      - name: Informational production SDK probe (not PR source validation)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          const root = 'https://activity.shardsinc.co.uk';
          for (const url of [
            'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2.5.0/+esm',
            'https://esm.sh/@discord/embedded-app-sdk@2.5.0?bundle',
            'https://unpkg.com/@discord/embedded-app-sdk@2.5.0/package.json'
          ]) {
            try {
              const result=await fetch(url,{signal:AbortSignal.timeout(12000)});
              const sample=(await result.text()).slice(0,180).replaceAll('\\n',' ');
              console.log('UPSTREAM',url, result.status, result.url, result.headers.get('content-type'), sample);
            } catch (e) {
              console.log('UPSTREAM_ERROR',url,e?.name||'error');
            }
          }

          for (const path of ['/sdk.js','/npm/zod@3.25.0/+esm']) {
            const response = await fetch(root + path, {signal: AbortSignal.timeout(12000)});
            const body = await response.text();
            console.log(path, response.status, response.headers.get('content-type'), 'bytes',body.length, 'detail',body.slice(0,180));
            if (!response.ok || !response.headers.get('content-type')?.includes('javascript')) {
              throw new Error('Production SDK proxy route unavailable: '+path);
            }
            if (!body || body.includes('SDK dependency temporarily unavailable')) {
              throw new Error('SDK proxy did not return module source: '+path);
            }
            if (path === '/sdk.js') {
              const first = body.slice(0, 240);
              console.log('SDK source prefix:', first.replaceAll('\n',' ').slice(0,160));
              const imports = [...body.matchAll(/(?:import|from)\s*["']([^"']+)["']/g)].map(x=>x[1]);
              console.log('SDK imports (first 12)',imports.slice(0,12));
              const outside = imports.filter(x=>x.startsWith('http://')||x.startsWith('https://'));
              if (outside.length) throw new Error('SDK has unproxied absolute dependencies');
            }
          }
          EOF
      - name: Live HTTPS + Cloudflare Worker smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          const origin='https://activity.shardsinc.co.uk';
          const targets=[
            ['/', 'text/html'],
            ['/styles.css', 'text/css'],
            ['/app.js', 'javascript'],
            ['/sdk.js', 'javascript'],
            ['/api/health','application/json'],
            ['/api/engineering','application/json']
          ];
          for(const [path,type] of targets){
            let response;
            let lastError;
            for(let attempt=0;attempt<3;attempt++){
              try {
                response=await fetch(origin+path,{headers:{Accept:'application/json, text/html, */*'},signal:AbortSignal.timeout(10000)});
                if(response.ok)break;
                lastError=new Error('HTTP '+response.status+' for '+path);
              } catch(err){lastError=err;}
              if(attempt<2)await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!response?.ok)throw lastError || new Error(path+' unreachable');
            if(!response.headers.get('content-type')?.includes(type))throw new Error('Unexpected content type for '+path);
            const content=await response.text();
            if(path==='/api/health'){
              const data=JSON.parse(content);
              if(data.service!=='Shards Mission Control'||data.agent_execution!=='not_enabled')throw new Error('Incorrect health contract');
            }
            if(path==='/api/engineering'){
              const data=JSON.parse(content);
              if(data.schema!=='shards.activity.engineering.v1'||data.repositories?.length!==3)throw new Error('Incorrect engineering data contract');
            }
            if(path==='/'){
              if(!content.includes('Shards Mission Control'))throw new Error('Missing Activity shell');
              if(!response.headers.get('content-security-policy')?.includes('frame-ancestors'))throw new Error('Missing frame policy');
            }
            console.log('verified '+path+' ['+response.status+']');
          }
          EOF

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: \${OLLAMA_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull \"$$\{OLLAMA_MODEL}\""]
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DISCORD_BOT_TOKEN: \${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_APPLICATION_ID: \${DISCORD_APPLICATION_ID:-1562965805413568532}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: \${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_TIMEOUT_MS: \${OLLAMA_TIMEOUT_MS:-120000}
      SHARDS_TASK_STORE_PATH: /data/tasks.json
    volumes:
      - bot_data:/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_models:
  bot_data:
